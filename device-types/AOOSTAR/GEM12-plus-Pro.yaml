  DC barrel supply: 19 V / 6.32 A. Chassis weight: 460 g. Airflow: side-to-rear.
  Adapter capacity is not a measured chassis power draw.
  The installed removable wireless card is an Intel AX200 (PCI 8086:2723, USB Bluetooth 8087:0029).
