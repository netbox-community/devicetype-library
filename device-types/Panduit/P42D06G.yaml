comments: |
  G6 Monitored Input (MI) PDU, label model PP11032-0016
  1-Phase, 32A, 230V, IEC 60309 2P+E 6h 32A (IP44) inlet, 7.4 kVA
  36x C13 + 6x C19 outlets in 2 color-coded banks of 21 outlets, one circuit breaker per bank (B1 L-N, B2 L-N).
  B1 is the lower bank (inlet end), B2 the upper bank. Each bank has 18x C13 with 3x C19 at its top end.
  Outlets carry no printed numbers. Numbering used here: bank by bank from B1, bottom to top,
  outlets 1-21 = B1 (C19: 19-21), outlets 22-42 = B2 (C19: 40-42).
  Aggregate input monitoring only. Hot-swappable controller with ETH0 (Ethernet/PDU In, primary),
  ETH1 (PDU Out, daisy chain), RJ45 serial console, USB and two sensor ports (Sensor-1, Sensor-2).
  Sources: Panduit G6 iPDU specification sheet, Panduit G6 PDU user manual v1.5 (FW 5.x), on-site photos
  NOTE: Do NOT set maximum_draw on the power port - this prevents NetBox from
  calculating downstream device draw propagation (NetBox issue #8177).

console-ports:
  - name: Serial
    label: Serial
    type: rj-45

interfaces:
  - name: ETH0
    label: Ethernet/PDU In
    type: 1000base-t
    mgmt_only: true
  - name: ETH1
    label: PDU Out
    type: 1000base-t
    mgmt_only: true

power-ports:
