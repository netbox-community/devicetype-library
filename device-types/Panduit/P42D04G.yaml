comments: |
  G6 Monitored Input (MI) PDU
  3-Phase Wye, 32A, 230/400V, IEC 60309 3P+N+E 6h 32A (IP44) inlet, 22 kVA
  30x C13 + 12x C19 outlets in 6 color-coded banks of 7 outlets (2x C19 + 5x C13), one circuit breaker per bank.
  Banks B1 (inlet end) to B6 (top). Breaker labels: B1 L1-N, B2 L2-N, B3 L3-N, B4 L1-N, B5 L2-N, B6 L3-N.
  Bank pairs B1/B2, B3/B4 and B5/B6 share one C13 block each. B1, B3 and B5 have their C19 pair
  below the block, B2, B4 and B6 above it. The controller sits between B2 and B3.
  Outlets carry no printed numbers. Numbering used here: bank by bank from B1, bottom to top within each bank,
  B1 = 1-7, B2 = 8-14, B3 = 15-21, B4 = 22-28, B5 = 29-35, B6 = 36-42.
  Aggregate input monitoring only. Hot-swappable controller with ETH0 (Ethernet/PDU In, primary),
  ETH1 (PDU Out, daisy chain), RJ45 serial console, USB and two sensor ports (Sensor-1, Sensor-2).
  Sources: Panduit G6 iPDU specification sheet, Panduit G6 PDU user manual v1.5 (FW 5.x), on-site photos
  NOTE: Do NOT set maximum_draw on the power port - this prevents NetBox from
  calculating downstream device draw propagation (NetBox issue #8177).

console-ports:
  - name: Serial
    label: Serial
    type: rj-45

interfaces:
  - name: ETH0
    label: Ethernet/PDU In
    type: 1000base-t
    mgmt_only: true
  - name: ETH1
    label: PDU Out
    type: 1000base-t
