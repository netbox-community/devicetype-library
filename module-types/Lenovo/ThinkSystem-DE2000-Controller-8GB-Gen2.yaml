---
manufacturer: Lenovo
model: ThinkSystem DE2000 Controller 8GB Gen2
comments: '[Lenovo ThinkSystem DE2000H product guide](https://lenovopress.lenovo.com/lp0881-thinksystem-de2000h-hybrid-storage-array) (feature code BQ9Y).
  Gen2 controllers have no baseboard host ports; host ports are on the optional HIC.'
console-ports:
  - name: Controller {module} Console RJ-45
    type: rj-45
  - name: Controller {module} Console Micro-USB
    type: usb-micro-b
interfaces:
  - name: Controller {module} Port P1
    type: 1000base-t
    mgmt_only: true
  - name: Controller {module} SAS Expansion 1
    type: other
  - name: Controller {module} SAS Expansion 2
    type: other
module-bays:
  - name: Controller {module} HIC
    position: '1'
